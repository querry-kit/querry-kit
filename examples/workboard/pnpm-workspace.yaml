packages:
  - apps/*
  - libs/*
  - vendor/*

nodeVersion: 26.13.0
minimumReleaseAge: 1440

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true

# Staged projects use this workspace's install policy. Preserve their relevant overrides here.
overrides:
  effect@<=3.22.0: 3.22.1
  glob@>=9.0.0 <14.0.2: 14.0.2
  minimatch@>=7.0.0 <11.0.1: 11.0.1
  argparse@1.0.10: 2.0.1
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@1.1.16: 1.1.18
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  browserslist@<=4.28.6: ^4.28.7
  '@tiptap/core@<3.30.5': ^3.30.5
  devalue@>=5.1.0 <=5.9.2: 5.9.4
  esbuild@0.27.7: 0.28.2
  follow-redirects@>=1.16.0 <1.16.2: 1.16.2
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  js-yaml@>=5.0.0 <5.4.1: ^5.4.3
  multer@<2.3.0: ^2.3.0
  'mkdist@2.4.1>vue-sfc-transformer': 0.2.5
  nanoid@3.3.16: 3.3.18
  node-forge@<=1.4.2: 1.4.3
  postcss@8.5.21: 8.5.23
  qs@<6.16.0: 6.17.1
  serialize-javascript@>=7.1.1 <7.1.4: 7.1.4
  shell-quote@>=1.8.4 <1.11.0: 1.12.0
  simple-git@>=3.15.0 <4.0.1: 4.0.2
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0

# The pinned Nuxt UI checkout carries this patch for the workspace's braces version.
patchedDependencies:
  braces@3.0.3: vendor/nuxt-ui/patches/braces@3.0.3.patch

peerDependencyRules:
  allowedVersions:
    '@nuxt/module-builder@1.0.3>typescript': '6.0.2'
    'tsconfck@3.1.6>typescript': '6.0.2'
    'unbuild@3.6.1>typescript': '6.0.2'
    'mkdist@2.4.1>vue-sfc-transformer': '0.2.5'
