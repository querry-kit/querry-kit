  - multer@2.3.0
  - '@nuxtjs/sitemap@8.5.1'
  - nuxtseo-shared@5.3.16
  - '@querry-kit/nuxt@0.2.9'
  - '@querry-kit/nuxt-ui@3.3.9'
overrides:
