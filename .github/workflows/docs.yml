name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - package-changelog-updated
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import-lint:
    name: Lint ${{ matrix.source }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        source: [packages/nest, packages/nuxt, packages/nuxt-ui, imports/example]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Lint with the imported repository's lockfile and rules
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          # Outside the destination workspace, just as in the original repositories.
          dir=$(mktemp -d "$RUNNER_TEMP/import-lint.XXXXXXXX")
          git archive "HEAD:$SOURCE" | tar -x -C "$dir"
          cd "$dir"
          if [ "$SOURCE" = imports/example ]; then
            node scripts/stage-querry-kit.mjs
          fi
          pnpm install --frozen-lockfile
          pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint destination workspace
        run: pnpm run lint --ignore-pattern 'packages/nest/**' --ignore-pattern 'packages/nuxt/**' --ignore-pattern 'packages/nuxt-ui/**' --ignore-pattern 'imports/example/**'

      - name: Typecheck documentation
        run: pnpm docs:typecheck

      - name: Install browser dependencies
        run: pnpm --dir apps/docs exec playwright install --with-deps chromium

      - name: Test documentation
        run: pnpm docs:test

      - name: Build documentation
        run: pnpm docs:build

      - name: Verify static entrypoints
        run: |
          test -s apps/docs/.output/public/index.html
          test -s apps/docs/.output/public/example/index.html
          test -s apps/docs/.output/public/docs/nuxt/index.html
          test -s apps/docs/.output/public/docs/nuxt-ui/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/.output/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, import-lint]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
