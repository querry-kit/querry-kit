name: Workspace CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: scope
        env:
          FORCE_FULL: ${{ vars.WORKSPACE_CI_FORCE_FULL }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/ci/select-jobs.test.mjs
          echo "plan=$(node scripts/ci/select-jobs.mjs)" >> "$GITHUB_OUTPUT"
  libraries:
    needs: scope
    if: fromJSON(needs.scope.outputs.plan).libraries[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.scope.outputs.plan).libraries }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/workspace
      - run: pnpm build:packages
      - env: { LIB: "${{ matrix.id }}" }
        run: |
          pnpm --filter "@querry-kit/$LIB" lint
          if [[ "$LIB" == nest ]]; then
            pnpm --filter @querry-kit/nest check
            pnpm --filter @querry-kit/nest test:optional-peers
          else
            pnpm --filter "@querry-kit/$LIB" typecheck
          fi
          pnpm --filter "@querry-kit/$LIB" test:coverage
  consumers:
    needs: scope
    if: fromJSON(needs.scope.outputs.plan).consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/workspace
      - run: |
          pnpm build:packages
          pnpm examples:build
          pnpm examples:check
          pnpm examples:lint
          pnpm examples:format:check
          pnpm examples:sources:check
          pnpm --filter @workboard/app exec playwright install --with-deps chromium
          pnpm examples:test:api
          pnpm examples:test:compose
  packed:
    needs: scope
    if: fromJSON(needs.scope.outputs.plan).packed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/workspace
      - run: |
          pnpm exec eslint scripts tests/packed --max-warnings=0
          pnpm build:packages
          pnpm verify:packages
          pnpm verify:release-plan
  docs:
    needs: scope
    if: fromJSON(needs.scope.outputs.plan).docs
    outputs:
      artifact-name: ${{ steps.archive.outputs.name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/workspace
      - run: |
          pnpm build:packages
          pnpm docs:lint
          pnpm docs:typecheck
          pnpm --dir apps/docs exec playwright install --with-deps chromium
          pnpm docs:test
      - name: Archive the tree served by Playwright
        id: archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'querry-kit/querry-kit'
        run: |
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C apps/docs/.output/pages-test/querry-kit .
          echo "name=pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - id: upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'querry-kit/querry-kit'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 7
          if-no-files-found: error
  result:
    name: Workspace checks
    if: always()
    needs: [scope, libraries, consumers, packed, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/select-jobs.mjs verify
  deploy:
    needs: [docs, result]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'querry-kit/querry-kit' && needs.docs.result == 'success' && needs.result.result == 'success'
    uses: ./.github/workflows/docs.yml
    permissions: { actions: read, pages: write, id-token: write }
    with:
      artifact-name: ${{ needs.docs.outputs.artifact-name }}
      artifact-id: ${{ needs.docs.outputs.artifact-id }}
      artifact-digest: ${{ needs.docs.outputs.artifact-digest }}
